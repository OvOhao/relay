name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Windows and macOS: the two platforms Relay is built and tested on (see README, "Good to know").
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
